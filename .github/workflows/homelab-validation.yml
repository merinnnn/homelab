name: Homelab Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          find . -name "*.sh" -type f -print0 | xargs -0 -r -n 1 bash -n

      - name: Validate Docker Compose files
        env:
          PROMETHEUS_IMAGE: prom/prometheus:v3.15.1
          GRAFANA_IMAGE: grafana/grafana:13.3.0
          ALERTMANAGER_IMAGE: prom/alertmanager:v0.34.2
          MONITORING_STACK_DIR: /opt/homelab/monitoring
          MONITORING_PRIVATE_DIR: /etc/homelab/monitoring
          HOMARR_IMAGE: ghcr.io/homarr-labs/homarr:v2.10.1
          HOMARR_SECRET_DIR: /etc/homelab/homarr
          N8N_IMAGE: docker.n8n.io/n8nio/n8n:2.47.7
          N8N_RUNNERS_IMAGE: n8nio/runners:2.47.7
          N8N_POSTGRES_IMAGE: postgres:17.12-alpine
          N8N_SECRET_DIR: /etc/homelab/n8n
          N8N_CA_FILE: /opt/homelab/reverse-proxy/root.crt
          CADDY_IMAGE: caddy:2.11.7-alpine
          PROXY_BIND_IP: 127.0.0.1
          PROXY_STACK_DIR: /opt/homelab/reverse-proxy
        run: |
          find configs/docker -name "docker-compose.yml" -type f -print0 | xargs -0 -r -I {} docker compose -f "{}" config --no-env-resolution --quiet

      - name: Test offline behavior
        run: node scripts/tests/offline-behavior.cjs

      - name: Test application deployment behavior
        run: node scripts/tests/apps-deployment.cjs

      - name: Reject embedded identities in scripts
        run: node scripts/tests/no-embedded-identities.cjs

      - name: Test native Pi-hole deployment behavior
        run: bash scripts/tests/pihole-native-offline.sh

      - name: Test local service access helpers
        run: |
          bash scripts/tests/reverse-proxy-offline.sh
          node scripts/tests/static-network-offline.cjs
          python3 scripts/tests/local-dns-offline.py

      - name: Validate private password service Compose structure
        env:
          VAULTWARDEN_IMAGE: vaultwarden/server:1.37.4
        run: docker compose -f configs/docker/vaultwarden/compose.json config --no-env-resolution --quiet

      - name: Test password vault and dashboard behavior
        run: |
          bash scripts/tests/homarr-offline.sh
          python3 scripts/tests/homarr-bootstrap-offline.py
          python3 scripts/tests/vaultwarden-offline.py

      - name: Test node monitoring behavior
        run: |
          bash scripts/tests/monitoring-offline.sh
          bash scripts/tests/node-exporter-offline.sh

      - name: Test private Telegram receiver setup
        run: python3 scripts/tests/telegram-offline.py

      - name: Test n8n deployment, account and backup behavior
        run: |
          bash scripts/tests/n8n-offline.sh
          python3 scripts/tests/n8n-bootstrap-offline.py
          python3 scripts/tests/n8n-backup-offline.py
          python3 scripts/tests/homarr-n8n-link-offline.py

      - name: Test Home Assistant VM ownership and failure behavior
        run: python3 scripts/tests/home-assistant-vm.py
