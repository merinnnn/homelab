rule_files:
  - node-alerts.yml
evaluation_interval: 1m
tests:
  - name: exporter outage waits two minutes
    interval: 1m
    input_series:
      - series: 'up{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: NodeDown
        exp_alerts: []
      - eval_time: 2m
        alertname: NodeDown
        exp_alerts:
          - exp_labels:
              job: proxmox-nodes
              instance: 192.168.1.2:9100
              node: pve01
              severity: critical
            exp_annotations:
              summary: pve01 exporter is unavailable
              description: The node exporter has not responded for two minutes. Check the node and the monitoring path.
  - name: low available RAM waits ten minutes
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="proxmox-nodes",instance="192.168.1.3:9100",node="pve02"}'
        values: '5+0x15'
      - series: 'node_memory_MemTotal_bytes{job="proxmox-nodes",instance="192.168.1.3:9100",node="pve02"}'
        values: '100+0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: NodeLowMemory
        exp_alerts: []
      - eval_time: 10m
        alertname: NodeLowMemory
        exp_alerts:
          - exp_labels:
              job: proxmox-nodes
              instance: 192.168.1.3:9100
              node: pve02
              severity: warning
            exp_annotations:
              summary: pve02 has less than 10% available RAM
  - name: CPU high usage persists before firing
    interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",mode="idle",cpu="0"}'
        values: '0+5x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: NodeHighCPU
        exp_alerts: []
      - eval_time: 15m
        alertname: NodeHighCPU
        exp_alerts:
          - exp_labels:
              instance: 192.168.1.2:9100
              node: pve01
              severity: warning
            exp_annotations:
              summary: pve01 CPU usage is above 90%
  - name: critical disk excludes memory and read-only filesystems
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",device="/dev/root",mountpoint="/",fstype="ext4"}'
        values: '4+0x15'
      - series: 'node_filesystem_size_bytes{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",device="/dev/root",mountpoint="/",fstype="ext4"}'
        values: '100+0x15'
      - series: 'node_filesystem_readonly{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",device="/dev/root",mountpoint="/",fstype="ext4"}'
        values: '0+0x15'
      - series: 'node_filesystem_avail_bytes{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",device="tmpfs",mountpoint="/run",fstype="tmpfs"}'
        values: '1+0x15'
      - series: 'node_filesystem_size_bytes{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",device="tmpfs",mountpoint="/run",fstype="tmpfs"}'
        values: '100+0x15'
      - series: 'node_filesystem_readonly{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",device="tmpfs",mountpoint="/run",fstype="tmpfs"}'
        values: '0+0x15'
      - series: 'node_filesystem_avail_bytes{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",device="/dev/readonly",mountpoint="/media",fstype="ext4"}'
        values: '1+0x15'
      - series: 'node_filesystem_size_bytes{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",device="/dev/readonly",mountpoint="/media",fstype="ext4"}'
        values: '100+0x15'
      - series: 'node_filesystem_readonly{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",device="/dev/readonly",mountpoint="/media",fstype="ext4"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: NodeCriticalDiskSpace
        exp_alerts: []
      - eval_time: 10m
        alertname: NodeCriticalDiskSpace
        exp_alerts:
          - exp_labels:
              job: proxmox-nodes
              instance: 192.168.1.2:9100
              node: pve01
              device: /dev/root
              mountpoint: /
              fstype: ext4
              severity: critical
            exp_annotations:
              summary: pve01 / has less than 5% disk space
      - eval_time: 10m
        alertname: NodeLowDiskSpace
        exp_alerts:
          - exp_labels:
              job: proxmox-nodes
              instance: 192.168.1.2:9100
              node: pve01
              device: /dev/root
              mountpoint: /
              fstype: ext4
              severity: warning
            exp_annotations:
              summary: pve01 / has less than 15% disk space
  - name: healthy resources do not alert
    interval: 1m
    input_series:
      - series: 'up{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01"}'
        values: '1+0x20'
      - series: 'node_memory_MemAvailable_bytes{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01"}'
        values: '25+0x20'
      - series: 'node_memory_MemTotal_bytes{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01"}'
        values: '100+0x20'
      - series: 'node_cpu_seconds_total{job="proxmox-nodes",instance="192.168.1.2:9100",node="pve01",mode="idle",cpu="0"}'
        values: '0+50x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: NodeDown
        exp_alerts: []
      - eval_time: 15m
        alertname: NodeLowMemory
        exp_alerts: []
      - eval_time: 15m
        alertname: NodeHighCPU
        exp_alerts: []
  - name: failed management unit waits five minutes
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="proxmox-nodes",instance="192.168.1.3:9100",node="pve02",name="pveproxy.service",state="failed"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: NodeFailedManagementService
        exp_alerts: []
      - eval_time: 5m
        alertname: NodeFailedManagementService
        exp_alerts:
          - exp_labels:
              job: proxmox-nodes
              instance: 192.168.1.3:9100
              node: pve02
              name: pveproxy.service
              state: failed
              severity: warning
            exp_annotations:
              summary: pve02 service pveproxy.service has failed
