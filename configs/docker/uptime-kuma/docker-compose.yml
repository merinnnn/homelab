services:
  uptime-kuma:
    image: ${KUMA_IMAGE:-louislam/uptime-kuma:2.5.8}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${KUMA_BIND_IP:-127.0.0.1}:${KUMA_PORT:-3001}:3001"
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      TZ: ${TZ:-Europe/London}
      UPTIME_KUMA_PORT: "3001"
      UPTIME_KUMA_DB_TYPE: sqlite
    healthcheck:
      test: ["CMD", "/app/extra/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  uptime-kuma-data:
    name: homelab-uptime-kuma-data
    driver: local
