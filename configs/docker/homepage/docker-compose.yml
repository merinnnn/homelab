services:
  homepage:
    image: ${HOMEPAGE_IMAGE:?A pinned image digest is required}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.home.arpa
      HOMEPAGE_AUTH_ENABLED: "false"
      HOSTNAME: 0.0.0.0
      LOG_TARGETS: stdout
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Europe/London
    volumes:
      - "${HOMEPAGE_STACK_DIR:?An absolute stack directory is required}/current/config:/app/config:ro"
    networks:
      proxy:
        aliases:
          - homelab-homepage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "-Y", "off", "http://127.0.0.1:3000/api/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: homelab-proxy_default
